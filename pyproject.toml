[project]
name = "rastro-sec"
version = "0.1.0"
description = "Two-phase host reconnaissance: fast sweep, then per-service enumeration."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0"]

[project.scripts]
rastro = "rastro.cli:entrypoint"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rastro"]
